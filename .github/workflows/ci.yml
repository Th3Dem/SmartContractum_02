name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml playwright && playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          for f in frontend/public/js/profile-page.js frontend/public/js/profile.js frontend/public/js/card.js frontend/public/js/feed.js frontend/public/js/article.js; do
            echo "Checking $f..."
            node --check "$f" || exit 1
          done

      - name: Run unit & integration tests
        run: python3 -m unittest discover tests -v

      - name: Run browser smoke tests
        env:
          RUN_BROWSER_SMOKE: '1'
        run: python3 -m unittest tests/test_issue22_sc023_browser_smoke.py tests/test_issue192_profile_mobile_themes_regressions.py tests/test_issue244_mobile_header.py -v
