<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Публикация — SmartContractum</title>

  <!-- Early Theme Initialization -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('ag_theme') || localStorage.getItem('sc_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {}
    })();
  </script>

  <!-- Highlight.js Themes (Offline-first) -->
  <link rel="stylesheet" id="hljs-theme" href="vendor/highlight/github-dark.min.css">

  <!-- Application Styles (100% Offline-First, Onest font family) -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/article.css">

  <style>
    body, button, input, textarea, select, h1, h2, h3, h4, h5, h6, p, span, a, div, *, *::before, *::after {
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
  </style>
</head>
<body class="app-body">
  <div class="app-container">
    <!-- ================================================================
         TOP STICKY HEADER (Unified Design System)
    ================================================================= -->
    <header class="app-header" id="appHeader">
      <div class="header-container">
        <!-- Brand Logo -->
        <a href="index.html" class="brand-logo" aria-label="SmartContractum Главная" title="На главную">
          <div class="logo-icon-box" aria-hidden="true">
            <svg class="smart-contract-logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="scDocGradFeedUnified" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#38bdf8"></stop>
                  <stop offset="0.5" stop-color="#6188ff"></stop>
                  <stop offset="1" stop-color="#16c784"></stop>
                </linearGradient>
              </defs>
              <path d="M7 3.5h11.5l7.5 7.5v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2z" fill="rgba(56, 189, 248, 0.06)" stroke="url(#scDocGradFeedUnified)" stroke-width="1.8" stroke-linejoin="round"></path>
              <path d="M18.5 3.5v6a1.5 1.5 0 0 0 1.5 1.5h6" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              <line x1="9.5" y1="12.5" x2="15.5" y2="12.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"></line>
              <line x1="9.5" y1="17.5" x2="19.5" y2="17.5" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round"></line>
              <line x1="9.5" y1="22.5" x2="16.5" y2="22.5" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"></line>
              <circle cx="23" cy="23" r="5" fill="#0b1426" stroke="#16c784" stroke-width="1.8"></circle>
              <path d="M21 23l1.5 1.5 3-3" stroke="#16c784" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <div class="logo-text-group">
            <span class="logo-title"><span class="logo-smart">Smart</span><span class="logo-contractum">Contractum</span></span>
          </div>
        </a>

        <!-- Navigation (2 items: Дом, Лента) -->
        <nav class="header-nav" id="headerNav" aria-label="Основная навигация">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="index.html" class="nav-link" id="navIndex">
                <span class="nav-icon-box">
                  <svg class="nav-svg-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>
                </span>
                <span class="nav-text">Дом</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="feed.html" class="nav-link" id="navFeed">
                <span class="nav-icon-box">
                  <svg class="nav-svg-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
                    <path d="M18 14h-8"></path>
                    <path d="M15 18h-5"></path>
                    <path d="M10 6h8v4h-8V6Z"></path>
                  </svg>
                </span>
                <span class="nav-text">Лента</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Header Right Group: Theme Switcher + Auth -->
        <div class="header-right-group">
          <!-- Theme Toggle Switch (Dark / Light Tumbler) -->
          <button type="button" class="btn-theme-toggle" id="btnThemeToggle" role="switch" aria-checked="false" title="Переключить тему оформления" aria-label="Переключить тему оформления">
            <span class="theme-toggle-track" aria-hidden="true">
              <span class="theme-toggle-thumb">
                <svg class="theme-icon-moon" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
                <svg class="theme-icon-sun" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
                </svg>
              </span>
            </span>
          </button>
          <div class="header-user-bar">
            <a href="#auth" class="header-login-action-btn" id="headerLoginBtn" title="Войти в личный кабинет">
              <div class="btn-user-avatar-wrap" aria-hidden="true">
                <svg class="btn-user-svg" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                </svg>
              </div>
              <span class="btn-user-label" id="headerUserLabel">Вход</span>
              <svg class="btn-user-arrow" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M6.22 3.22a.75.75 0 011.06 0l4.25 4.25a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 010-1.06z" clip-rule="evenodd"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Reading Layout Main Container (Comfortable 720px width) -->
    <main class="article-page-container">
      <!-- Article Top Action Bar -->
      <nav class="article-top-bar" aria-label="Действия со статьей">
        <button type="button" class="btn btn-secondary btn-back-feed" id="btnBackToFeed" title="Вернуться к ленте публикаций">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>В ленту</span>
        </button>

        <div class="article-actions-group">
          <button type="button" class="btn btn-secondary btn-action-bookmark" id="btnArticleBookmark" title="Сохранить в закладки" aria-label="Сохранить в закладки">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
            </svg>
            <span class="bookmark-text">В закладки</span>
          </button>

          <button type="button" class="btn btn-secondary btn-action-share" id="btnCopyLink" title="Скопировать постоянную ссылку на статью" aria-label="Скопировать ссылку">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span>Поделиться</span>
          </button>
        </div>
      </nav>

      <!-- Loading State Skeleton -->
      <div id="articleLoadingState" class="article-skeleton">
        <div class="skeleton-line skeleton-shimmer" style="width: 30%; height: 20px; margin-bottom: 16px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 85%; height: 38px; margin-bottom: 12px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 60%; height: 28px; margin-bottom: 24px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 100%; height: 260px; margin-bottom: 24px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 100%; height: 18px; margin-bottom: 10px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 95%; height: 18px; margin-bottom: 10px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 90%; height: 18px; margin-bottom: 10px;"></div>
      </div>

      <!-- Error State (404 / Missing) -->
      <div id="articleErrorState" class="article-error-state" style="display: none;">
        <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h2 class="error-state-title" id="articleErrorTitle">Статья не найдена или еще не опубликована</h2>
        <p class="error-state-desc" id="articleErrorDesc">
          Материал с указанным идентификатором не найден в утвержденном реестре публикаций платформы SmartContractum.
        </p>
        <a href="feed.html" class="btn btn-primary btn-error-feed">Вернуться в ленту публикаций</a>
      </div>

      <!-- Article Main Content View -->
      <article id="articleContentWrap" class="article-content-wrapper" style="display: none;">
        <!-- Header: Badges, Title, Lead & Author Meta -->
        <header class="article-header">
          <div class="article-badges" id="articleBadges"></div>
          <h1 class="article-title" id="articleTitle"></h1>
          <p class="article-lead" id="articleLead"></p>

          <div class="article-meta-row">
            <div class="article-author-info">
              <div class="article-author-avatar" id="articleAuthorAvatar">SC</div>
              <div class="article-author-details">
                <span class="article-author-name" id="articleAuthorName"></span>
                <span class="article-author-role" id="articleAuthorRole"></span>
              </div>
            </div>

            <div class="article-meta-side">
              <span class="article-publish-date" id="articlePublishDate"></span>
              <span class="meta-dot"></span>
              <div class="article-reading-time">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span id="articleReadingTime"></span>
              </div>
            </div>
          </div>

          <!-- Cover Image Container -->
          <div class="article-cover-container" id="articleCoverContainer" style="display: none;">
            <img class="article-cover-img" id="articleCoverImg" src="" alt="Обложка публикации">
          </div>
        </header>

        <!-- Interactive Table of Contents (TOC) -->
        <nav class="article-toc-box" id="articleTocBox" aria-label="Оглавление статьи" style="display: none;">
          <div class="toc-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span class="toc-title">Содержание</span>
          </div>
          <ul class="toc-list" id="articleTocList"></ul>
        </nav>

        <!-- Article Rich HTML Body -->
        <div class="article-body-content" id="articleBodyContent"></div>

        <!-- Article Tags & Keywords Footer -->
        <footer class="article-footer">
          <div class="article-tags-wrap" id="articleTagsWrap">
            <span class="tags-label">Ключевые слова:</span>
            <div class="article-tags-list" id="articleTagsList"></div>
          </div>

          <!-- Bottom Action Bar -->
          <div class="article-bottom-actions">
            <button type="button" class="btn btn-secondary btn-back-feed-bottom" id="btnBackToFeedBottom">
              ← Вернуться в ленту
            </button>
            <button type="button" class="btn btn-secondary btn-action-bookmark" id="btnArticleBookmarkBottom">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
              </svg>
              <span>Сохранить в закладки</span>
            </button>
          </div>
        </footer>
      </article>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="articleToast" class="article-toast" role="status" aria-live="polite" style="display: none;"></div>

  <!-- 100% Offline-First Vendor Scripts & Logic -->
  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/article.js"></script>
</body>
</html>
